# EASE Development Stack
# Start with: docker-compose -f docker-compose.dev.yml up -d
#
# This provides PostgreSQL and Redis for Phase 2 development.
# MVP runs on SQLite + in-process, so this is optional for now.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ease
      POSTGRES_USER: ease
      POSTGRES_PASSWORD: ease_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ease"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Future: EASE API service (when containerized)
  # api:
  #   build: .
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://ease:ease_dev@postgres:5432/ease
  #     REDIS_URL: redis://redis:6379/0
  #   ports:
  #     - "8000:8000"

volumes:
  pgdata:
